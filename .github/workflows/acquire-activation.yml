name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: get-activation-file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.83f1
      - name: Upload manual activation file
        uses: actions/upload-artifact@v4
        with:
          name: manual-activation-file
          path: ${{ steps.get-activation-file.outputs.filePath }}
