name: VOW iOS Cloud Build & TestFlight

on:
  workflow_dispatch: # 允許在 GitHub 網頁手動點擊「Run workflow」觸發
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

jobs:
  build-ios:
    name: Build iOS Xcode Project on Cloud Mac
    runs-on: macos-latest
    steps:
      # 1. 檢出程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 緩存 Unity Library 資料夾 (讓後續每次構建加速 5~10 倍)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      # 3. 使用 GameCI 在雲端 Mac 上執行 Unity 構建
      - name: Run Unity Builder (iOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          buildsPath: build/iOS

      # 4. 上傳構建產物 (Xcode 專案與安裝包) 供直接下載
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOW_iOS_Build
          path: build/iOS
          retention-days: 14

      # 5. (可選) 若配置了 Apple API Key，自動推送到 TestFlight
      - name: Upload to TestFlight (Optional)
        if: env.APP_STORE_CONNECT_KEY != ''
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "檢測到 Apple 憑證，自動執行 Fastlane 上傳 TestFlight..."
          # 執行 fastlane pilot 上傳
