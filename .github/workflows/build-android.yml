name: VOW Android Cloud Build (APK)

on:
  workflow_dispatch: # 允許手動點擊「Run workflow」
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

jobs:
  build-android:
    name: Build Android APK on Cloud Linux
    runs-on: ubuntu-latest
    steps:
      # 1. 檢出程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 緩存 Library
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # 3. 使用 GameCI 在雲端構建 Android APK
      - name: Run Unity Builder (Android APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildsPath: build/Android
          buildName: VOW_Oath_Demo

      # 4. 上傳 APK 安裝包供直接下載
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW_Android_APK
          path: build/Android/VOW_Oath_Demo.apk
          retention-days: 14
