<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08090d" />
  <title>VOW 誓約</title>
  <link rel="manifest" href="./game-assets/manifest-CFSRgfAJ.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #08090d; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif; touch-action: none; }
    #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
    
    /* 遊戲 HUD (純粹全螢幕點擊無遮蔽) */
    #hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    
    /* 頂部極簡狀態 */
    .top-status { position: absolute; top: 16px; left: 20px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .top-status h1 { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: #00f2fe; }
    .top-status p { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    /* 走A 節奏目押光環 (英雄腳底) */
    #cadence-ring { position: absolute; width: 90px; height: 90px; border: 3px solid #ffd700; border-radius: 50%; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(0.4); transition: opacity 0.06s, transform 0.15s ease-out; box-shadow: 0 0 20px #ffd700; }
    
    /* 點擊地面漣漪光圈 */
    .tap-ripple { position: absolute; width: 40px; height: 40px; border: 2px solid #00f2fe; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0.2); animation: rippleEffect 0.35s ease-out forwards; }
    @keyframes rippleEffect {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
    }

    /* 連擊與卡刀警示 */
    #combo-banner { position: absolute; top: 20px; right: 24px; color: #ffd700; font-size: 18px; font-weight: 900; opacity: 0; transition: opacity 0.15s, transform 0.15s; text-shadow: 0 0 12px rgba(255,215,0,0.8); pointer-events: none; }
    #jam-alert { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ff3344; font-size: 26px; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity 0.15s; text-shadow: 0 0 20px rgba(255,51,68,0.9); }

    /* 右下角：地脈符印 (目標軸心向量施法) */
    #rune-button { position: absolute; right: 28px; bottom: 28px; width: 78px; height: 78px; border-radius: 50%; background: radial-gradient(circle, rgba(0,242,254,0.3) 0%, rgba(10,15,30,0.85) 100%); border: 2px solid #00f2fe; box-shadow: 0 0 18px rgba(0,242,254,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; pointer-events: auto; touch-action: none; transition: transform 0.08s, box-shadow 0.08s; }
    #rune-button:active { transform: scale(0.92); box-shadow: 0 0 30px #00f2fe; }
    #rune-button span { font-size: 14px; font-weight: 900; letter-spacing: 1px; }
    #rune-button small { font-size: 9px; color: #94a3b8; margin-top: 2px; }

    /* 符印施法提示 */
    #rune-tip { position: absolute; bottom: 115px; right: 28px; background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; color: #00f2fe; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; }

    /* 傷害飄字 */
    .damage-popup { position: absolute; color: #ff3b30; font-size: 19px; font-weight: 900; text-shadow: 0 0 6px #000; pointer-events: none; animation: floatUp 0.7s ease-out forwards; transform: translate(-50%, -50%); z-index: 50; }
    .damage-popup.crit { color: #ffd700; font-size: 24px; text-shadow: 0 0 10px rgba(255,215,0,0.8); }
    .damage-popup.dash { color: #00f2fe; font-size: 17px; text-shadow: 0 0 12px #00f2fe; }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      30% { transform: translate(-50%, -15px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(1.0); }
    }

    /* 浮動血條 */
    .hp-bar-wrap { position: absolute; width: 60px; height: 6px; background: rgba(0,0,0,0.7); border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); pointer-events: none; transform: translate(-50%, -50%); }
    .hp-bar-fill { height: 100%; border-radius: 2px; background: #00f2fe; width: 100%; }
    .hp-bar-fill.enemy { background: #ff3344; }
    .hp-bar-fill.minion { background: #ffd700; }
    .hp-label { position: absolute; top: -14px; width: 100%; text-align: center; color: #e2e8f0; font-size: 10px; font-weight: 800; text-shadow: 0 1px 2px #000; }
  </style>
  <script type="module" crossorigin src="./game-assets/index-C5eqFK5R.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <div class="top-status">
      <h1>VOW 誓約</h1>
      <p>點地移動 • 點怪攻擊 • 命中瞬間原地微彈指 (15-30px) 觸發 360° 滑步衝刺</p>
    </div>

    <div id="combo-banner">★ PERFECT CADENCE x1 ★</div>
    <div id="jam-alert">⚠️ 卡刀硬直！(ANTI-MASHING)</div>
    <div id="cadence-ring"></div>
    <div id="rune-tip">拇指旋轉瞄準角度 • 鬆手即放</div>

    <!-- 右下唯一按鈕：地脈符印 -->
    <div id="rune-button">
      <span>岩壁</span>
      <small>向量施法</small>
    </div>

    <!-- 血條層與點擊回饋層 -->
    <div id="effect-layer"></div>
  </div>

</body>
</html>
