<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOW v0.4.1</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1b20;
                   touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none;
                      background: #1F1F20; }
      #vow-version { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 10; pointer-events: none; white-space: nowrap;
                     font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: rgba(255,255,255,0.72);
                     text-align: center; text-shadow: 0 1px 2px #000; }
      #vow-loading { position: fixed; left: 0; right: 0; top: 46%; z-index: 9; text-align: center;
                     font: 15px/1.6 system-ui, sans-serif; color: #e8e8e8; }
      #vow-bar { width: 60%; max-width: 420px; height: 6px; margin: 10px auto 0; background: rgba(255,255,255,0.18); border-radius: 3px; overflow: hidden; }
      #vow-bar-fill { width: 0%; height: 100%; background: #33f2ff; transition: width 0.15s linear; }
      #vow-error { display: none; color: #ff8a70; white-space: pre-wrap; padding: 0 16px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="vow-loading">
      <div id="vow-loading-text">載入中…</div>
      <div id="vow-bar"><div id="vow-bar-fill"></div></div>
      <div id="vow-error"></div>
    </div>

    <!-- 版本列：判斷「看到的是不是剛部署的那一版」只看這一行。版本號來自 Assets/Scripts/Core/VowVersion.cs，建置時間與 commit 由建置腳本寫入。 -->
    <div id="vow-version">VOW v0.4.1<br>build 2026-09-19 10:47 UTC · 7c38042</div>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#vow-loading");
      var barFill = document.querySelector("#vow-bar-fill");
      var errorBox = document.querySelector("#vow-error");

      function showError(message) {
        document.querySelector("#vow-loading-text").textContent = "載入失敗";
        errorBox.style.display = "block";
        errorBox.textContent = message;
      }

      createUnityInstance(canvas, {
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VOW",
        productName: "VOW",
        productVersion: "0.4.1",
        // 手機的 devicePixelRatio 常為 3：全解析度渲染對 WebGL 太重，上限壓在 2
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) { if (type === "error") showError(message); else console.warn(message); }
      }, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        loading.style.display = "none";
        window.vowUnityInstance = instance;
      }).catch(function (message) {
        showError(String(message));
      });
    </script>
  </body>
</html>
